<div class="signup-container">
  <div class="signup-card">
    <div class="signup-header">
      <h1>Create Account</h1>
      <p>Join Romania Tourism today</p>
    </div>

    <form (ngSubmit)="onSignup()" class="signup-form">
      <div class="form-group">
        <label for="username">Username *</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          placeholder="Choose a username"
          required
          [disabled]="isLoading"
        >
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Enter your email"
          required
          [disabled]="isLoading"
        >
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Create a password (min 6 characters)"
          required
          [disabled]="isLoading"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password *</label>
        <input
          type="password"
          id="confirmPassword"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Re-enter your password"
          required
          [disabled]="isLoading"
        >
      </div>

      <div class="form-group">
        <label for="travelPreferences">Travel Preferences (Optional)</label>
        <textarea
          id="travelPreferences"
          [(ngModel)]="travelPreferences"
          name="travelPreferences"
          placeholder="Tell us about your travel interests..."
          rows="3"
          [disabled]="isLoading"
        ></textarea>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button
        type="submit"
        class="btn-signup"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading">Creating account...</span>
      </button>

      <div class="login-link">
        <p>Already have an account?
          <a (click)="goToLogin()" class="link">Sign in here</a>
        </p>
      </div>
    </form>
  </div>
</div>
